<div class="overtime-shell">
  <h2>Overtime Requests</h2>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field>
      <mat-label>OT Date</mat-label>
      <input matInput type="date" formControlName="otDate">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Hours</mat-label>
      <input matInput type="number" formControlName="hours">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Reason</mat-label>
      <input matInput formControlName="reason">
    </mat-form-field>
    <button mat-raised-button color="primary" type="submit">Submit</button>
  </form>

  <table mat-table [dataSource]="overtimeList" class="mat-elevation-z2">
    <ng-container matColumnDef="otDate">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let row">{{ row.otDate }}</td>
    </ng-container>
    <ng-container matColumnDef="hours">
      <th mat-header-cell *matHeaderCellDef>Hours</th>
      <td mat-cell *matCellDef="let row">{{ row.hours }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row">{{ row.status }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
