<div class="attendance-shell">
  <h2>Attendance</h2>
  <div class="actions">
    <button mat-raised-button color="primary" (click)="checkIn()">Check In</button>
    <button mat-raised-button color="accent" (click)="checkOut()">Check Out</button>
  </div>

  <table mat-table [dataSource]="history" class="mat-elevation-z2">
    <ng-container matColumnDef="attendanceDate">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let row">{{ row.attendanceDate }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row">{{ row.status }}</td>
    </ng-container>
    <ng-container matColumnDef="lateFlag">
      <th mat-header-cell *matHeaderCellDef>Late</th>
      <td mat-cell *matCellDef="let row">{{ row.lateFlag ? 'Yes' : 'No' }}</td>
    </ng-container>
    <ng-container matColumnDef="earlyDeparture">
      <th mat-header-cell *matHeaderCellDef>Early Leave</th>
      <td mat-cell *matCellDef="let row">{{ row.earlyDeparture ? 'Yes' : 'No' }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
